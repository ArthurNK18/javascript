<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <h1>Sistema de nacionalidade</h1>
    Escreva aqui sua nacionalidade: <input type="text" name="txtna" id="txtna"> <input type="button" value="Enviar" onclick="Calcular('txtna')">
    <div id="res">

    </div>

    <script>
        function Calcular () {
            var txtn = window.document.getElementById('txtna')
            var res = window.document.getElementById('res')
            if (txtn == `Brasileiro`) {
            res.innerHTML == `<p>Você é Brasileiro!!!</p>`
        } else {
            res.innerHTML == `<p>Você é Estrangeiro!!!</p>`
        }

        }
    </script>
</body>
</html>
